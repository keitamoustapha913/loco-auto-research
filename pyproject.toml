[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loco-autoresearch"
version = "0.1.0"
description = "Guarded autonomous single-GPU research laboratory for normal-only logical anomaly localization"
requires-python = "==3.10.*"
dependencies = [
    "torch==2.7.1",
    "torchvision==0.22.1",
    "numpy>=1.26,<3",
    "Pillow>=10,<13",
    "PyYAML>=6,<7",
    "jsonschema>=4.21,<5",
    "psutil>=5.9,<8",
    "pytest>=9.1.1",
    "scipy>=1.15.3",
    "scikit-learn>=1.4,<2",
]


[project.optional-dependencies]
train = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scipy>=1.11,<2"]
ui = ["mlflow>=3.0,<5", "streamlit>=1.40,<2", "pandas>=2,<3", "plotly>=5,<7"]
dev = ["pytest>=8,<10", "pytest-cov>=5,<7"]
all = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scipy>=1.11,<2", "mlflow>=3.0,<5", "streamlit>=1.40,<2", "pandas>=2,<3", "plotly>=5,<7", "pytest>=8,<10"]

[project.scripts]
loco-lab = "orchestrator.lab_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmark*", "orchestrator*", "dashboard*", "candidates*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv.sources]
torch = { index = "pytorch-cu118" }
torchvision = { index = "pytorch-cu118" }

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
